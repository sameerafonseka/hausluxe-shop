
name: Test Push ACR

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-login:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        run: |
          az account show --output table

      - name: Sign in to Azure Container Registry
        run: az acr login --name sfonseka

      - name: docker pull alpine
        run: |
          docker pull alpine:3.24.4

      - name: docker tag alpine
        run: |
          docker tag alpine:3.24.4 sfonseka.azurecr.io\alpine:3.24.4

      - name: docker push alpine
        run: |
          docker push sfonseka.azurecr.io\alpine:3.24.4